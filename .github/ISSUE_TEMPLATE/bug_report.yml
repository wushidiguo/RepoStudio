name: Bug report
description: Report something that is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more context you give, the faster we can fix it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps, and the repo URL you were generating a video for (if any).
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any relevant error output (redact secrets).
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Node version, ffmpeg version.
      placeholder: e.g. Windows 11, Python 3.12, Node 20, ffmpeg 7
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
