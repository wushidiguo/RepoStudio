name: Feature request
description: Suggest an enhancement to RepoStudio.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a problem?
      description: Describe the problem or gap you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
